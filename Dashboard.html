<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>史詩戰情室：誘導公式討伐戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
        }
        
        /* 🐉 巨龍浮水印背景 (維持 30% 透明度) */
        .bg-watermark {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('monster-lv7.png');
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.3; 
            z-index: -1; 
            pointer-events: none; 
        }

        .glass-dark { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .hp-bar-bg { background: #334155; border: 2px solid #0f172a; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        .hp-bar-fill { background: linear-gradient(90deg, #e11d48 0%, #f43f5e 100%); transition: width 1s ease-in-out; box-shadow: 0 0 20px rgba(244, 63, 94, 0.6); }
        
        /* 🚨 紅框閃爍動畫 */
        .alert-flash { animation: flashRed 1.5s infinite; }
        @keyframes flashRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.4); border-color: #ef4444; } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        /* 🐲 巨龍漂浮動畫 */
        .float-anim { animation: float 4s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }

        /* 美化捲軸 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="p-6 h-screen flex flex-col relative z-0">

    <div class="bg-watermark"></div>

    <header class="flex justify-between items-center mb-4">
        <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-orange-400 tracking-widest drop-shadow-md">
            🔥 暗黑幾何巨龍：討伐戰情室
        </h1>
        <div class="flex gap-4">
            <select id="class-filter" class="bg-slate-800 border-2 border-slate-600 text-white px-6 py-3 rounded-xl font-bold text-xl cursor-pointer" onchange="fetchData()">
                <option value="">全校總覽</option>
                <option value="高一甲">高一甲</option>
                <option value="高一乙">高一乙</option>
                <option value="高一丙">高一丙</option>
                <option value="高一丁">高一丁</option>
            </select>
            <button onclick="resetData()" class="bg-red-900/50 text-red-400 border-2 border-red-500 hover:bg-red-800 px-6 py-3 rounded-xl font-bold text-xl transition shadow-lg cursor-pointer">重置該班紀錄</button>
        </div>
    </header>

    <div class="w-full mb-6">
        <div class="flex justify-between text-rose-300 font-black mb-3 text-2xl px-2 drop-shadow-sm">
            <span>😈 終極魔王 HP</span>
            <span id="boss-hp-text">10000 / 10000</span>
        </div>
        <div class="w-full h-12 hp-bar-bg rounded-full overflow-hidden relative">
            <div id="boss-hp-fill" class="h-full hp-bar-fill rounded-full" style="width: 100%;"></div>
        </div>
    </div>

    <div class="w-full flex justify-between items-center gap-6 mb-6 h-[32vh]">
        
        <div class="h-full relative flex-grow flex items-center justify-center">
            <img src="monster-lv7.png" alt="終極巨龍" class="h-full max-w-full object-contain drop-shadow-[0_0_60px_rgba(244,63,94,0.8)] float-anim">
        </div>
        
        <div class="glass-dark p-4 h-full w-[25vw] flex justify-center items-center hidden lg:flex">
            <canvas id="pieChart"></canvas>
        </div>

        <div class="glass-dark p-4 h-full w-[16vw] flex flex-col justify-between items-center hidden lg:flex">
            <h3 class="text-center font-black text-sky-400 mt-2 text-xl w-full border-b-2 border-slate-600 pb-2">📲 掃碼加入討伐</h3>
            <div class="bg-white p-2 rounded-xl flex-grow w-full my-2 flex items-center justify-center shadow-inner">
                <img src="qrcode.png" alt="遊戲二維碼" class="max-h-full max-w-full object-contain">
            </div>
            <p class="text-sm font-bold text-slate-400">Scan to Join!</p>
        </div>

    </div>

    <div class="grid grid-cols-4 gap-6 flex-grow overflow-hidden">
        
        <div class="glass-dark p-5 flex flex-col h-full">
            <h3 class="text-center font-black text-orange-400 mb-4 text-2xl border-b-2 border-slate-600 pb-3">⚔️ 輸出王 (總傷害)</h3>
            <ul id="list-damage" class="space-y-3 flex-grow overflow-y-auto pr-2"></ul>
        </div>
        <div class="glass-dark p-5 flex flex-col h-full">
            <h3 class="text-center font-black text-sky-400 mb-4 text-2xl border-b-2 border-slate-600 pb-3">⚡ 連擊王 (最高Combo)</h3>
            <ul id="list-combo" class="space-y-3 flex-grow overflow-y-auto pr-2"></ul>
        </div>
        <div class="glass-dark p-5 flex flex-col h-full">
            <h3 class="text-center font-black text-emerald-400 mb-4 text-2xl border-b-2 border-slate-600 pb-3">🎓 學霸王 (正確率)</h3>
            <ul id="list-acc" class="space-y-3 flex-grow overflow-y-auto pr-2"></ul>
        </div>

        <div class="glass-dark p-5 bg-red-950/20 border-red-900 border-4 flex flex-col h-full">
            <h3 class="text-center font-black text-red-500 mb-4 text-2xl border-b-2 border-red-900 pb-3">🚨 危急警告 (需支援)</h3>
            <div id="warning-list" class="space-y-4 flex-grow overflow-y-auto font-black text-red-300 pr-2 text-xl">
                <div class="text-center text-slate-500 mt-6">目前無學生遭遇危險</div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 請確保這是您剛才部署取得的正確 GAS 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycby3kwx7xzFAl0Dc02Myo9C7pvlk0T7rSCA0mSA7p4aWyylz8cfX-u0mHlC0-hiFiJwp/exec";
        
        let pieChart;

        // 初始化圖表
        function initCharts() {
            Chart.defaults.color = '#cbd5e1';
            Chart.defaults.font.size = 18; 
            Chart.defaults.font.weight = 'bold';
            
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: { 
                    labels: ['見習生', '進階術士', '大魔法師'], 
                    datasets: [{ data: [0,0,0], backgroundColor: ['#94a3b8', '#38bdf8', '#fbbf24'], borderWidth: 0 }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { position: 'right', labels: { font: { size: 18, weight: 'bold' }, padding: 15 } }, 
                        title: { display: true, text: '全班戰鬥等級', color: '#fff', font: { size: 22, weight: '900' }, padding: { bottom: 10 } } 
                    } 
                }
            });
        }

        async function fetchData() {
            const cls = document.getElementById('class-filter').value;
            try {
                const res = await fetch(`${GAS_URL}?action=getDashboardData&className=${encodeURIComponent(cls)}`);
                const data = await res.json();
                updateDashboard(data);
            } catch (e) { console.error("Data fetch failed", e); }
        }

        function updateDashboard(data) {
            // 更新 Boss 血條
            const hpPct = Math.max(0, (data.bossHp / data.bossMaxHp) * 100);
            document.getElementById('boss-hp-fill').style.width = hpPct + "%";
            document.getElementById('boss-hp-text').innerText = `${Math.floor(data.bossHp)} / ${data.bossMaxHp}`;

            // 排行榜生成 
            const sortedDamage = [...data.players].sort((a,b) => b.damage - a.damage).slice(0, 10);
            const sortedCombo = [...data.players].sort((a,b) => b.combo - a.combo).slice(0, 10);
            
            const sortedAcc = [...data.players]
                .filter(p => p.totalAns >= 5)
                .sort((a,b) => b.acc - a.acc)
                .slice(0, 10)
                .map(p => ({ ...p, accPercent: Math.round(p.acc * 100) })); 

            const createListHTML = (arr, valKey, suffix = "") => arr.map((p, i) => `
                <li class="flex justify-between items-center bg-slate-800/50 p-3 rounded-lg border border-slate-700 backdrop-blur-sm">
                    <span class="text-xl font-bold"><span class="text-slate-400 w-8 inline-block text-center font-black">${i+1}.</span> ${p.name} <span class="text-sm text-slate-400 ml-1">(Lv.${p.level})</span></span>
                    <span class="font-black text-white text-2xl">${p[valKey]}${suffix}</span>
                </li>`).join('');

            document.getElementById('list-damage').innerHTML = createListHTML(sortedDamage, 'damage') || '<li class="text-center text-slate-500 text-lg mt-4">尚無數據</li>';
            document.getElementById('list-combo').innerHTML = createListHTML(sortedCombo, 'combo') || '<li class="text-center text-slate-500 text-lg mt-4">尚無數據</li>';
            document.getElementById('list-acc').innerHTML = createListHTML(sortedAcc, 'accPercent', '%') || '<li class="text-center text-slate-500 text-lg mt-4">尚無數據 (需答滿5題)</li>';

            // 🚨 智慧警告系統
            const warningList = document.getElementById('warning-list');
            let warnings = [];
            data.players.forEach(p => {
                if (p.mistakes >= 5) warnings.push(`<div class="bg-red-500/20 p-4 rounded-xl border-2 border-red-500 alert-flash shadow-lg text-red-200">⚠️ ${p.name}<br>連續答錯 ${p.mistakes} 題！</div>`);
                else if (p.totalAns >= 5 && p.acc < 0.6) warnings.push(`<div class="bg-orange-500/20 p-4 rounded-xl border-2 border-orange-500 shadow-lg text-orange-200">⚠️ ${p.name}<br>正確率過低 (${(p.acc*100).toFixed(0)}%)</div>`);
            });
            warningList.innerHTML = warnings.length > 0 ? warnings.join('') : '<div class="text-center text-slate-500 mt-6 text-xl">目前無學生遭遇危險</div>';

            // 更新圓餅圖 (等級分佈)
            let levels = [0, 0, 0];
            data.players.forEach(p => {
                if (p.level >= 7) levels[2]++;
                else if (p.level >= 4) levels[1]++;
                else levels[0]++;
            });
            pieChart.data.datasets[0].data = levels;
            pieChart.update();
        }

        async function resetData() {
            const cls = document.getElementById('class-filter').value;
            if(!cls) { alert("請先在上方選擇一個特定班級，才能執行重置喔！"); return; }
            if(confirm(`⚠️ 確定要清空【${cls}】的所有戰鬥紀錄嗎？此操作無法還原！`)) {
                await fetch(`${GAS_URL}?action=reset&className=${encodeURIComponent(cls)}`);
                alert(`✅ 【${cls}】資料已重置完畢！`);
                fetchData();
            }
        }

        // 啟動程式 (每 3 秒自動抓取)
        initCharts();
        fetchData();
        setInterval(fetchData, 3000);
    </script>
</body>
</html>
